server:
  port: ${APPLICATION_SERVICE_PORT:8082}

spring:
  application:
    name: application-service
  datasource:
    url: jdbc:postgresql://${APPLICATION_SERVICE_DB_HOST:localhost}:${APPLICATION_SERVICE_DB_PORT:5434}/${APPLICATION_SERVICE_DB_NAME:application_service}
    username: ${APPLICATION_SERVICE_DB_USERNAME:postgres}
    password: ${APPLICATION_SERVICE_DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
