name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - job-service
          - application-service
          - resume-storage-service
          - resume-parsing-service
          - ats-screening-service
          - api-gateway
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ matrix.service }}-${{ hashFiles(format('{0}/pom.xml', matrix.service)) }}
          restore-keys: maven-${{ matrix.service }}-

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: ./mvnw -B test

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports

  build-images:
    name: Build image (${{ matrix.service }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - job-service
          - application-service
          - resume-storage-service
          - resume-parsing-service
          - ats-screening-service
          - api-gateway
          - frontend
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ats-${{ matrix.service }}:ci ./${{ matrix.service }}
