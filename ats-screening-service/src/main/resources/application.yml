server:
  port: ${ATS_SCREENING_SERVICE_PORT:8085}

spring:
  application:
    name: ats-screening-service

services:
  job-service:
    base-url: ${JOB_SERVICE_URL:http://localhost:8081}

http-client:
  connect-timeout-ms: ${HTTP_CLIENT_CONNECT_TIMEOUT_MS:2000}
  read-timeout-ms: ${HTTP_CLIENT_READ_TIMEOUT_MS:3000}

screening:
  advance-threshold-percent: ${SCREENING_ADVANCE_THRESHOLD:70}
  # "rule-based" (default) or "embedding" — bean name of the active ScoringStrategy
  strategy: ${SCREENING_STRATEGY:rule-based}

openai:
  api-key: ${OPENAI_API_KEY:}
  embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  read-timeout-ms: ${OPENAI_READ_TIMEOUT_MS:8000}
